bpf:
  masquerade: true

cluster:
  name: cluster-1
  id: 1

kubeProxyReplacement: true
l7Proxy: false
# k8sServiceHost: 10.96.0.1
# k8sServicePort: 443

hubble:
  enabled: true
  metrics:
    enabled:
    - dns:query;ignoreAAAA
    - drop
    - tcp
    - flow
    - icmp
    - http
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: false
  relay:
    enabled: true
    prometheus:
      enabled: false
      serviceMonitor:
        enabled: false
  tls:
    auto:
      enabled: true
      method: "helm"
      certValidityDuration: 365
  ui:
    enabled: true

ingressController:
  enabled: false
  default: false

authentication:
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        server:
          dataStorage:
            enabled: true
            storageClass: local-path
            # For k3d/development, use local-path storage
            # storageClass: local-path
            # accessMode: ReadWriteOnce
            # size: 1Gi
          # Run as root to write to HostPath socket directory
          securityContext:
            runAsUser: 0
            runAsGroup: 0

encryption:
  enabled: true
  type: wireguard
  nodeEncryption: true
  strictMode:
    enabled: false


prometheus:
  enabled: true
  serviceMonitor:
    enabled: false
dashboards:
  enabled: true


# version: 1.17.4
operator:
  replicas: 2
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
  dashboards:
    enabled: true
envoy:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false
    service:
      type: NodePort
#     # tls:
#     #   authMode: cluster
#     #   server:
#     #     extraDnsNames:
#     #       - "*.{{ cilium_default_domain }}"

ipam:
  mode: kubernetes
#   mode: cluster-pool
# clusterPoolIPv4PodCIDRList:
#   - 10.0.0.0/9

socketLB:
  enabled: true
  hostNamespaceOnly: true
ipv4:
  enabled: true
ipv4NativeRoutingCIDR: "10.0.0.0/9"

monitor:
  # -- Enable the cilium-monitor sidecar.
  enabled: true

# loadBalancer:
#   nodePort:
#     # -- Enable the Cilium NodePort service implementation.
#     enabled: true

l2announcements:
  enabled: true

# --- Cluster Mesh control-plane ---
clustermesh:
  useAPIServer: true
  enableEndpointSliceSynchronization: true
  apiserver:
    service:
      type: NodePort
      nodePort: 32379
  config:
    enabled: true
    clusters:
    - name: cluster-1
      # the cluster Clustermesh API server.
      # address: cluster1.mesh.cilium.io
      port: 32379
      ips:
      - 10.42.0.3
    - name: cluster-2
      # the cluster Clustermesh API server.
      # address: cluster1.mesh.cilium.io
      port: 32380
      ips:
      - 10.42.0.8