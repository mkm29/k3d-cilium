kind: UDSBundle
metadata:
  name: lgtm
  description: UDS bundle for horizontally scalable LGTM observability stack
  version: 0.1.0-lgtm.0-upstream

packages:
  - name: init
    repository: ghcr.io/zarf-dev/packages/init
    ref: v0.63.0@sha256:51590197b6e65193315baa2413fa9db16f235c63bb81fa5d8464e121dae2fd0c

  # Deploy uds-core base functional layer which includes istio, uds-operator, and uds CRDs
  - name: core-base
    # renovate: image=registry.defenseunicorns.com/sld-45/core-base
    repository: ghcr.io/defenseunicorns/packages/uds/core-base
    ref: 0.53.0-upstream@sha256:ad4f9b15b58a01d67b6a3a00c32e583ecce5b65af7f57b663bef990ba7057ec8
    overrides:
      pepr-uds-core:
        module:
          values:
            - path: additionalIgnoredNamespaces
              value:
                - keycloak
                - minio
                - minio-operator
                - postgres
                - postgres-operator
                - loki
                - kube-system
      istio-controlplane:
        cni:
          values:
            - path: cniConfDir
              value: "/etc/cni/net.d"
            - path: cniBinDir
              value: "/opt/cni/bin"
        istiod:
          values:
            - path: _internal_defaults_do_not_set.cni.enabled
              value: true
            - path: _internal_defaults_do_not_set.cni.provider
              value: cilium

  - name: namespace-mod-lgtm
    path: build/
    ref: 0.1.0-lgtm.0-upstream

