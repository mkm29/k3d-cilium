# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: minio-common
  description: "UDS MinIO Common"

components:
  - name: minio
    required: true
    charts:
      - name: minio-config
        namespace: minio
        version: 0.1.0
        localPath: ../chart
      - name: minio
        url: https://charts.min.io/
        version: 5.4.0
        namespace: minio
        valuesFiles:
          - ../values/common-values.yaml
    actions:
      onDeploy:
        after:
          - description: Validate MinIO Package
            maxTotalSeconds: 300
            wait:
              cluster:
                kind: packages.uds.dev
                name: minio
                namespace: minio
                condition: "'{.status.phase}'=Ready"