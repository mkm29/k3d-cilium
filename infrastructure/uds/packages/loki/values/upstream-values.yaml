loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.5.5
  storage:
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    type: s3
    s3:
      endpoint: "minio.uds-dev-stack.svc.cluster.local:9000"
      region: ""
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: loki
      secretAccessKey: lokipass

  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: snappy
  tracing:
    enabled: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 4

  storageConfig:
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
      cache_ttl: 24h
      shared_store: s3

  limits_config:
    ingestion_rate_mb: 10 # Increase from default
    ingestion_burst_size_mb: 20 # Usually 2x ingestion_rate
    max_global_streams_per_user: 10000
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 5MB

memcachedExporter:
  enabled: true
  image:
    repository: docker.io/prom/memcached-exporter
    tag: v0.15.3

test:
  enabled: false

lokiCanary:
  enabled: false

sidecar:
  image:
    repository: docker.io/kiwigrid/k8s-sidecar
    tag: 1.30.3

memcached:
  image:
    repository: docker.io/memcached
    tag: 1.6.39-alpine

deploymentMode: Distributed

ingester:
  replicas: 3
  maxUnavailable: 2
  appProtocol:
    grpc: "grpc"
querier:
  replicas: 3
  maxUnavailable: 2
  appProtocol:
    grpc: "grpc"
queryFrontend:
  replicas: 2
  maxUnavailable: 1
  appProtocol:
    grpc: "grpc"
queryScheduler:
  replicas: 2
  maxUnavailable: 1
distributor:
  replicas: 3
  maxUnavailable: 2
  appProtocol:
    grpc: "grpc"
compactor:
  replicas: 1
indexGateway:
  replicas: 2
  maxUnavailable: 1

# optional experimental components
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

minio:
  enabled: false

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

singleBinary:
  replicas: 0
